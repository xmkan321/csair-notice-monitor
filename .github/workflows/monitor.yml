name: 南航公告监控

on:
  schedule:
    # 每30分钟运行一次，UTC 0:00-16:00 = 北京时间 8:00-24:00
    - cron: '*/30 0-16 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write # 允许提交 state.json

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行监控脚本
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python monitor.py

      - name: 提交状态更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "状态文件无变化"
          else
            git commit -m "更新公告状态 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
